[project]
name = "exoplanet-db"
version = "0.1.30"
description = "AI agent-friendly, lightweight exoplanet database and portal with reproducibility tracking, MCP, and priority scheduling."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Bruno Rahle", email = "brahle@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "astropy>=6.1.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "jsonschema>=4.23.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
exoplanet-db = "exoplanet_db.ingest.nasa_tap:main"
exoplanet-mcp = "exoplanet_db.mcp.server:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"exoplanet_db.portal" = ["static/*"]

