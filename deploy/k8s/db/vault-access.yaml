apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: exoplanet-db
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: exoplanet-db
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: Secret
        name: internal-ca-secret
        key: tls.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "k8s-exoplanet-db"
          serviceAccountRef:
            name: vault-auth
