apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-minio-credentials
  namespace: exoplanet-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: cnpg-backup-minio-credentials
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: k8s/exoplanet-db/minio-backup
        property: access-key
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: k8s/exoplanet-db/minio-backup
        property: secret-key
