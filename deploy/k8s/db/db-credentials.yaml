apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: exoplanet-owner-db-creds
  namespace: exoplanet-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: exoplanet-owner-db-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        DATABASE_URL: "postgresql+asyncpg://{{ .username }}:{{ .password | urlquery }}@exoplanet-db-db-rw.exoplanet-db.svc.cluster.local:5432/exoplanet"
  data:
    - secretKey: username
      remoteRef:
        key: k8s/exoplanet-db/db-owner
        property: username
    - secretKey: password
      remoteRef:
        key: k8s/exoplanet-db/db-owner
        property: password
---
