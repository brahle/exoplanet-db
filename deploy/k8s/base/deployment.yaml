apiVersion: apps/v1
kind: Deployment
metadata:
  name: exoplanet-db-api
  namespace: exoplanet-db
  labels:
    app: exoplanet-db-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exoplanet-db-api
  template:
    metadata:
      labels:
        app: exoplanet-db-api
    spec:
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: harbor.brahle.com/library/exoplanet-db:v0.1.16
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9090
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: exoplanet-app-db-creds
                  key: DATABASE_URL
            - name: ENABLE_METRICS_SERVER
              value: "true"
            - name: METRICS_PORT
              value: "9090"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
