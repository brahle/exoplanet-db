apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: exoplanet-db-api
  namespace: exoplanet-db
  labels:
    app: exoplanet-db-api
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: exoplanet-db-api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
