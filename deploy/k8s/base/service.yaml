apiVersion: v1
kind: Service
metadata:
  name: exoplanet-db-api
  namespace: exoplanet-db
  labels:
    app: exoplanet-db-api
spec:
  type: ClusterIP
  selector:
    app: exoplanet-db-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
